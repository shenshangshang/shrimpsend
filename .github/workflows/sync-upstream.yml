name: Sync upstream

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/shrimpsend/shrimpsend.git
          git fetch upstream main
          if git merge upstream/main --no-edit; then
            git push origin main
          else
            echo "::error::Upstream merge conflict — resolve manually, then push."
            exit 1
          fi
